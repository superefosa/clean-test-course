name: Lesson 5 DAST

on:
  push:
    branches:
      - lesson-5-complete

jobs:
  function_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run functional tests with coverage
        run: npm test -- --coverage --watchAll=false

  deploy:
    needs: [function_test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Generate deployment package
        run: |
          zip -r deploy.zip build Dockerfile

      - name: Deploy to Elastic Beanstalk (placeholder)
        run: echo "Placeholder for Deployment"

  security_test:
    needs: [deploy]
    runs-on: ubuntu-latest

    steps:
      - name: OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: "http://hangry-web-dev.us-east-1.elasticbeanstalk.com/"
